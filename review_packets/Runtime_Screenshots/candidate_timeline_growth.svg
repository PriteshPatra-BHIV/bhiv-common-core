<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="1000" height="600">
  <defs>
    <style>
      .bg { fill: #0b0f19; }
      .card { fill: #111827; stroke: #1f2937; stroke-width: 1.5; rx: 8px; }
      .text-title { font-family: monospace; font-size: 14px; font-weight: 700; fill: #f3f4f6; }
      .text-mono { font-family: monospace; font-size: 12px; fill: #38bdf8; }
      .text-sub { font-family: monospace; font-size: 11px; fill: #9ca3af; }
    </style>
  </defs>

  <rect width="1000" height="600" class="bg" />
  <rect x="20" y="20" width="960" height="560" class="card" />

  <text x="50" y="60" class="text-title">CANDIDATE TIMELINE &amp; CAPABILITY GROWTH RADAR (PRITESH PATRA)</text>
  <text x="50" y="85" class="text-sub">Lineage: HIAS Hostel Convergence ➔ T-GOV-002 Enterprise Core ➔ T-GOV-003 HSM Anchoring</text>

  <!-- Timeline Nodes -->
  <g transform="translate(80, 130)">
    <!-- Node 1 -->
    <circle cx="50" cy="50" r="16" fill="#10b981" />
    <text x="25" y="85" class="text-mono">Phase 2 Task</text>
    <text x="15" y="102" class="text-sub">HIAS Convergence</text>
    <text x="20" y="120" font-family="monospace" font-size="10" fill="#34d399">Score: 100/100</text>
    <text x="10" y="138" font-family="monospace" font-size="9" fill="#f87171">Weakness: logic</text>

    <!-- Bar 1 -->
    <line x1="90" y1="50" x2="360" y2="50" stroke="#10b981" stroke-width="4" />

    <!-- Node 2 (Current) -->
    <circle cx="400" cy="50" r="20" fill="#3b82f6" stroke="#93c5fd" stroke-width="3" />
    <text x="355" y="85" class="text-mono">T-GOV-002 (CURRENT)</text>
    <text x="350" y="102" class="text-sub">Enterprise Core &amp; IdP</text>
    <text x="365" y="120" font-family="monospace" font-size="10" fill="#34d399">Score: 100/100</text>
    <text x="345" y="138" font-family="monospace" font-size="9" fill="#34d399">Logic Hardened (FSM)</text>

    <!-- Bar 2 -->
    <line x1="440" y1="50" x2="710" y2="50" stroke="#3b82f6" stroke-width="4" stroke-dasharray="6,6" />

    <!-- Node 3 (Next) -->
    <circle cx="750" cy="50" r="16" fill="#64748b" />
    <text x="710" y="85" class="text-mono">T-GOV-003 (NEXT)</text>
    <text x="705" y="102" class="text-sub">Audit Ledger HSM</text>
    <text x="720" y="120" font-family="monospace" font-size="10" fill="#94a3b8">Target: 2026-11-28</text>
    <text x="715" y="138" font-family="monospace" font-size="9" fill="#94a3b8">Canonical Depth: OK</text>
  </g>

  <!-- Competency Radar & Growth Graph -->
  <rect x="50" y="300" width="900" height="240" rx="6" fill="#0f172a" />
  <text x="80" y="335" class="text-title">Competency Delta &amp; Weakness Remediation</text>
  <line x1="80" y1="350" x2="920" y2="350" stroke="#1e293b" />

  <text x="80" y="380" class="text-sub">Deterministic State Traversal:</text>
  <rect x="300" y="370" width="550" height="12" rx="3" fill="#1e293b" />
  <rect x="300" y="370" width="550" height="12" rx="3" fill="#10b981" />
  <text x="860" y="380" font-family="monospace" font-size="10" fill="#34d399">100% (50/50 runs)</text>

  <text x="80" y="415" class="text-sub">Strict Schema Boundary (v1.0):</text>
  <rect x="300" y="405" width="550" height="12" rx="3" fill="#1e293b" />
  <rect x="300" y="405" width="550" height="12" rx="3" fill="#10b981" />
  <text x="860" y="415" font-family="monospace" font-size="10" fill="#34d399">100% (0 untyped dicts)</text>

  <text x="80" y="450" class="text-sub">Identity Provider Hardening:</text>
  <rect x="300" y="440" width="550" height="12" rx="3" fill="#1e293b" />
  <rect x="300" y="440" width="525" height="12" rx="3" fill="#3b82f6" />
  <text x="860" y="450" font-family="monospace" font-size="10" fill="#93c5fd">96% (HMAC/Ed25519)</text>

  <text x="80" y="485" class="text-sub">Zero-Context-Switch Cognition:</text>
  <rect x="300" y="475" width="550" height="12" rx="3" fill="#1e293b" />
  <rect x="300" y="475" width="540" height="12" rx="3" fill="#10b981" />
  <text x="860" y="485" font-family="monospace" font-size="10" fill="#34d399">98% (&lt;45s review time)</text>

  <text x="80" y="520" class="text-sub">Zero Unhandled 500 Exceptions:</text>
  <rect x="300" y="510" width="550" height="12" rx="3" fill="#1e293b" />
  <rect x="300" y="510" width="550" height="12" rx="3" fill="#10b981" />
  <text x="860" y="520" font-family="monospace" font-size="10" fill="#34d399">100% (RFC-7807 problem details)</text>
</svg>
